dataset:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  datasets_dir: "data/datasets"
  max_sequence_length: 2000

model:
  hidden_size: 512
  num_layers: 6
  num_heads: 8
  dropout: 0.1

training:
  batch_size: 32
  learning_rate: 0.0001
  epochs: 100
  mixed_precision: true
  output_dir: "outputs"
