# OCR Module Configuration
# Used by train-ocr to instantiate models from the registry

model_name: "crnn_baseline"

# Optimizer settings
batch_size: 64
epochs: 17
eval_every: 1
learning_rate: 0.001

# Model specific configurations
model_config:
  img_channels: 1
  hidden_size: 256
  
# Dataset settings
img_height: 32
